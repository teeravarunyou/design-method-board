<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design Method Board V3 Host Controlled</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f6f6f3;overflow:hidden}.gate{position:fixed;inset:0;background:#f6f6f3;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px}.gate.hidden{display:none}.gateCard{width:min(560px,100%);background:#fff;border:1px solid #ddd;border-radius:18px;padding:28px;box-shadow:0 12px 40px #0001}.gateCard h2{margin:0 0 8px;font-size:28px}.gateCard p{color:#666;line-height:1.45}.gateTabs{display:flex;gap:8px;margin:20px 0}.gateTabs button.active{background:#222;color:#fff;border-color:#222}.gatePane{display:none}.gatePane.active{display:block}.field{display:block;margin:12px 0}.field span{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}.field input{width:100%;font-size:16px;padding:12px}.primary{background:#222;color:#fff;border-color:#222}.gateActions{display:flex;gap:8px;align-items:center;margin-top:16px}.roomBadge{font-size:12px;background:#f0f0ed;border-radius:8px;padding:7px 10px}.leaveBtn{font-size:12px}header{min-height:66px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:7px;padding:9px 12px;white-space:nowrap;flex-wrap:wrap;position:relative;z-index:100}h1{font-size:17px;margin-right:5px}button,input,select{padding:8px;border:1px solid #ccc;border-radius:8px;background:#fff;font-size:13px}button{cursor:pointer}.hostOnly.hidden,#pinWrap.hidden{display:none}.status{margin-left:auto;font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#aaa;margin-right:5px}#work{height:calc(100vh - 82px);overflow:auto;position:relative;background-image:radial-gradient(#ccc 1px,transparent 1px);background-size:20px 20px}#canvas{width:3000px;height:2000px;position:relative}.template{position:absolute;left:80px;top:70px;width:1600px;height:1050px;background:#ffffffdd;border:2px solid #777;border-radius:10px;pointer-events:none}.template h2{margin:0;padding:18px 22px;font-size:28px}.sub{padding:0 22px 12px;color:#666}.grid4{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;height:930px}.grid2{display:grid;grid-template-columns:1fr 1fr;height:930px}.cell{border:1px solid #aaa;padding:18px;font-size:22px;font-weight:bold}.journey{display:grid;grid-template-columns:180px repeat(5,1fr);height:900px}.journey div{border:1px solid #aaa;padding:12px}.axisX,.axisY{position:absolute;background:#555}.axisX{left:120px;right:120px;top:525px;height:2px}.axisY{top:110px;bottom:90px;left:800px;width:2px}.quad{position:absolute;font-weight:bold;font-size:20px}.q1{left:980px;top:180px}.q2{left:250px;top:180px}.q3{left:250px;top:760px}.q4{left:980px;top:760px}.note{position:absolute;min-width:100px;min-height:90px;padding:29px 10px 28px;box-shadow:0 3px 10px #0002;z-index:5}.note textarea{width:100%;height:100%;border:0;resize:none;background:transparent;outline:0;font-size:16px}.handle{position:absolute;left:0;right:0;top:0;height:25px;cursor:grab;border-bottom:1px solid #0001;padding:5px 7px;font-size:11px}.del{position:absolute;right:3px;top:2px;border:0;background:#ffffffaa;padding:1px 6px;border-radius:10px;z-index:20;cursor:pointer;font-size:16px;line-height:20px}.resize{position:absolute;right:2px;bottom:2px;width:15px;height:15px;cursor:nwse-resize;border-right:2px solid #555;border-bottom:2px solid #555}.vote{position:absolute;left:7px;bottom:5px;font-size:12px;font-weight:bold;background:#ffffff99;padding:3px 7px;border-radius:10px}.participant.voting .vote{cursor:pointer;outline:1px solid #777}.voting .handle{cursor:default}.voting textarea{pointer-events:none}#banner{position:fixed;top:75px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:7px 13px;border-radius:16px;font-size:12px;z-index:50;display:none}#timer{font-weight:bold;font-variant-numeric:tabular-nums;min-width:48px;text-align:center}</style></head>
<body>
<div id="gate" class="gate"><div class="gateCard"><h2>Design Method Board</h2><p>Create a collaborative room as the host, or join an existing room. Participants only need the Room Code.</p><div class="gateTabs"><button id="tabParticipant" class="active">Join as Participant</button><button id="tabHost">Join as Host</button><button id="tabCreate">Create Room</button></div><div id="paneParticipant" class="gatePane active"><label class="field"><span>Room Code</span><input id="participantRoom" autocomplete="off" maxlength="20" placeholder="e.g. RVUBPU"></label><div class="gateActions"><button id="participantJoin" class="primary">Join Room</button></div></div><div id="paneHost" class="gatePane"><label class="field"><span>Room Code</span><input id="hostRoom" autocomplete="off" maxlength="20" placeholder="Room code"></label><label class="field"><span>Host PIN</span><input id="hostJoinPin" type="password" inputmode="numeric" maxlength="6" placeholder="4–6 digits"></label><div class="gateActions"><button id="hostJoin" class="primary">Join as Host</button></div></div><div id="paneCreate" class="gatePane"><label class="field"><span>Room Code (optional)</span><input id="createCode" autocomplete="off" maxlength="20" placeholder="Leave blank to generate one"></label><label class="field"><span>Create Host PIN</span><input id="createPin" type="password" inputmode="numeric" maxlength="6" placeholder="4–6 digits"></label><div class="gateActions"><button id="createRoom" class="primary">Create Room</button></div></div></div></div><header><h1>Design Method Board V3</h1><span id="roomBadge" class="roomBadge">Not joined</span><button id="leave" class="leaveBtn">Leave Room</button>
<span class="hostOnly hidden">Template <select id="template"><option>Blank Board</option><option>Affinity Mapping</option><option>Empathy Map</option><option>How Might We</option><option>User Journey Map</option><option>Impact–Effort Matrix</option></select><button id="apply">Apply</button></span>
<button id="add">+ Sticky</button><select id="size"><option value="120,100">S</option><option value="160,140" selected>M</option><option value="220,180">L</option></select><select id="color"><option value="#fff2a8">Yellow</option><option value="#ffd9df">Pink</option><option value="#cfefff">Blue</option><option value="#d9f4d1">Green</option></select>
<span class="hostOnly hidden"><button id="voteBtn">Start Voting</button><button id="resetVotes">Reset Votes</button><select id="mins"><option value="3">3m</option><option value="5" selected>5m</option><option value="10">10m</option><option value="15">15m</option></select><button id="timerBtn">Start Timer</button></span><span id="timer">--:--</span>
<span id="currentTpl" title="Current template" style="font-size:12px;padding:6px 9px;background:#f3f3f0;border-radius:8px;max-width:190px;overflow:hidden;text-overflow:ellipsis">Template: Blank Board</span><span class="status"><span id="dot" class="dot"></span><span id="status">Connecting…</span></span></header>
<div id="banner"></div><div id="work"><div id="canvas"><div id="tpl"></div></div></div>
<script>
const sb=supabase.createClient('https://ihwckxqdehruhswrrrgg.supabase.co','sb_publishable_B_EYc60VZHObtUhJjLH2wA_s2w4y2Ja');let room=location.hash.slice(1)||'',role='participant',hostPin='',notesCh,boardCh,boardState=null,els=new Map(),tick=null;
const canvas=document.getElementById('canvas'),tpl=document.getElementById('tpl'),statusEl=document.getElementById('status'),dot=document.getElementById('dot'),gate=document.getElementById('gate');
function stat(s,ok=false){statusEl.textContent=s;dot.style.background=ok?'#24a148':'#aaa'}function hostUI(){document.querySelectorAll('.hostOnly').forEach(x=>x.classList.toggle('hidden',role!=='host'));document.body.classList.toggle('participant',role==='participant');document.body.classList.toggle('host',role==='host');document.getElementById('roomBadge').textContent=room?(role==='host'?'Host • ':'Participant • ')+room:'Not joined'}
async function noteUpd(id,p){p.updated_at=new Date().toISOString();await sb.from('notes').update(p).eq('id',id)}
function make(n){let e=document.createElement('div');e.className='note';e.style.cssText=`left:${n.x}px;top:${n.y}px;width:${n.width}px;height:${n.height}px;background:${n.color}`;e.innerHTML='<div class="handle">drag</div><button class="del">×</button><textarea></textarea><div class="vote">♥ <span></span></div><div class="resize"></div>';let ta=e.querySelector('textarea');ta.value=n.content||'';e.querySelector('.vote span').textContent=n.votes||0;let tm;ta.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>noteUpd(n.id,{content:ta.value}),300)};const del=e.querySelector('.del');
del.onpointerdown=ev=>{ev.preventDefault();ev.stopPropagation();};
del.onclick=async ev=>{
  ev.preventDefault();ev.stopPropagation();
  const {error}=await sb.from('notes').delete().eq('id',n.id);
  if(error){alert('Delete failed: '+error.message);console.error(error);}
  else{rem(n.id);}
};e.querySelector('.vote').onclick=ev=>{ev.stopPropagation();if(role!=='participant'||!boardState?.voting)return;let v=Number(e.querySelector('.vote span').textContent)||0;noteUpd(n.id,{votes:v+1})};
let h=e.querySelector('.handle'),sx,sy,ox,oy,last=0;h.onpointerdown=a=>{if(boardState?.voting)return;h.setPointerCapture(a.pointerId);sx=a.clientX;sy=a.clientY;ox=parseFloat(e.style.left);oy=parseFloat(e.style.top);h.onpointermove=b=>{let x=ox+b.clientX-sx,y=oy+b.clientY-sy;e.style.left=x+'px';e.style.top=y+'px';if(Date.now()-last>100){last=Date.now();noteUpd(n.id,{x,y})}};h.onpointerup=()=>{h.onpointermove=null;h.onpointerup=null;noteUpd(n.id,{x:parseFloat(e.style.left),y:parseFloat(e.style.top)})}};
let r=e.querySelector('.resize'),sx2,sy2,w,hg;r.onpointerdown=a=>{if(boardState?.voting)return;r.setPointerCapture(a.pointerId);sx2=a.clientX;sy2=a.clientY;w=e.offsetWidth;hg=e.offsetHeight;r.onpointermove=b=>{e.style.width=Math.max(100,w+b.clientX-sx2)+'px';e.style.height=Math.max(90,hg+b.clientY-sy2)+'px'};r.onpointerup=()=>{r.onpointermove=null;r.onpointerup=null;noteUpd(n.id,{width:e.offsetWidth,height:e.offsetHeight})}};return e}
function put(n){if(n.board_id!==room)return;let e=els.get(String(n.id));if(!e){e=make(n);els.set(String(n.id),e);canvas.appendChild(e)}else{e.style.left=n.x+'px';e.style.top=n.y+'px';e.style.width=n.width+'px';e.style.height=n.height+'px';e.style.background=n.color;let ta=e.querySelector('textarea');if(document.activeElement!==ta)ta.value=n.content||'';e.querySelector('.vote span').textContent=n.votes||0}}function rem(id){let e=els.get(String(id));if(e)e.remove();els.delete(String(id))}
function render(name){tpl.innerHTML='';if(name==='Blank Board')return;let d=document.createElement('div');d.className='template';if(name==='Affinity Mapping')d.innerHTML='<h2>Affinity Mapping</h2><div class="sub">Group similar ideas and name the themes</div><div class="grid4"><div class="cell">Theme 1</div><div class="cell">Theme 2</div><div class="cell">Theme 3</div><div class="cell">Theme 4</div></div>';if(name==='Empathy Map')d.innerHTML='<h2>Empathy Map</h2><div class="grid4"><div class="cell">SAYS</div><div class="cell">THINKS</div><div class="cell">DOES</div><div class="cell">FEELS</div></div>';if(name==='How Might We')d.innerHTML='<h2>How Might We…?</h2><div class="grid2"><div class="cell">INSIGHTS / PROBLEMS</div><div class="cell">HOW MIGHT WE QUESTIONS</div></div>';if(name==='User Journey Map')d.innerHTML='<h2>User Journey Map</h2><div class="journey"><div><b>Stage</b></div><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div><b>Actions</b></div><div></div><div></div><div></div><div></div><div></div><div><b>Thoughts</b></div><div></div><div></div><div></div><div></div><div></div><div><b>Emotions</b></div><div></div><div></div><div></div><div></div><div></div><div><b>Pain Points</b></div><div></div><div></div><div></div><div></div><div></div><div><b>Opportunities</b></div><div></div><div></div><div></div><div></div><div></div></div>';if(name==='Impact–Effort Matrix')d.innerHTML='<h2>Impact–Effort Matrix</h2><div class="axisX"></div><div class="axisY"></div><div class="quad q1">HIGH IMPACT / HIGH EFFORT</div><div class="quad q2">HIGH IMPACT / LOW EFFORT</div><div class="quad q3">LOW IMPACT / LOW EFFORT</div><div class="quad q4">LOW IMPACT / HIGH EFFORT</div>';tpl.appendChild(d)}
function applyBoard(b){boardState=b;const templateName=b.template||'Blank Board'; const templateSelect=document.getElementById('template'); if(templateSelect) templateSelect.value=templateName; render(templateName);const ct=document.getElementById('currentTpl');if(ct)ct.textContent='Template: '+templateName;document.body.classList.toggle('voting',!!b.voting);document.getElementById('voteBtn').textContent=b.voting?'End Voting':'Start Voting';let banner=document.getElementById('banner');banner.textContent=b.voting?'Voting is OPEN — click ♥ on a note':'';banner.style.display=b.voting?'block':'none';timerDisplay()}
function timerDisplay(){if(tick){clearInterval(tick);tick=null}let el=document.getElementById('timer');function draw(){if(!boardState)return;if(!boardState.timer_running&&!boardState.timer_end){el.textContent='--:--';return}let sec=boardState.timer_running&&boardState.timer_end?Math.max(0,Math.ceil((new Date(boardState.timer_end)-Date.now())/1000)):(boardState.timer_minutes||5)*60;el.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(sec<=0&&tick){clearInterval(tick);tick=null}}draw();if(boardState?.timer_running)tick=setInterval(draw,250)}
async function hostRpc(fn,args){if(role!=='host'||!hostPin){alert('Host PIN required');return false}const {error}=await sb.rpc(fn,{p_board_id:room,p_host_pin:hostPin,...args});if(error){alert(error.message);console.error(error);return false}return true}
async function boardUpd(p){if('template' in p)return hostRpc('host_set_template',{p_template:p.template});if('voting' in p)return hostRpc('host_set_voting',{p_voting:p.voting});if('timer_running' in p||'timer_minutes' in p||'timer_end' in p)return hostRpc('host_set_timer',{p_running:!!p.timer_running,p_minutes:Number(p.timer_minutes||boardState?.timer_minutes||5),p_timer_end:p.timer_end??null})}
async function loadRoom(){
 if(notesCh)await sb.removeChannel(notesCh);if(boardCh)await sb.removeChannel(boardCh);for(let e of els.values())e.remove();els.clear();stat('Loading…');
 let {data:b,error:be}=await sb.from('boards_public').select('*').eq('board_id',room).maybeSingle();if(be){alert(be.message);return false}if(!b){alert('Room not found. Check the Room Code.');return false}applyBoard(b);
 let {data:n,error}=await sb.from('notes').select('*').eq('board_id',room);if(error){alert(error.message);return false}(n||[]).forEach(put);
 notesCh=sb.channel('notes-'+room+'-'+crypto.randomUUID()).on('postgres_changes',{event:'INSERT',schema:'public',table:'notes',filter:'board_id=eq.'+room},p=>put(p.new))
 .on('postgres_changes',{event:'UPDATE',schema:'public',table:'notes',filter:'board_id=eq.'+room},p=>put(p.new))
 .on('postgres_changes',{event:'DELETE',schema:'public',table:'notes'},p=>{if(els.has(String(p.old.id)))rem(p.old.id)}).subscribe();
 boardCh=sb.channel('board-'+room+'-'+crypto.randomUUID()).on('postgres_changes',{event:'*',schema:'public',table:'boards',filter:'board_id=eq.'+room},p=>{if(p.new&&p.new.board_id===room){const safe={board_id:p.new.board_id,template:p.new.template,voting:p.new.voting,timer_end:p.new.timer_end,timer_running:p.new.timer_running,timer_minutes:p.new.timer_minutes,updated_at:p.new.updated_at};applyBoard(safe)}}).subscribe(s=>{if(s==='SUBSCRIBED')stat((role==='host'?'HOST':'PARTICIPANT')+' • LIVE • '+room,true)});return true
}
function cleanCode(v){return v.trim().toUpperCase()}
function showGate(show=true){gate.classList.toggle('hidden',!show)}
function selectGate(which){['Participant','Host','Create'].forEach(n=>{document.getElementById('tab'+n).classList.toggle('active',n.toLowerCase()===which);document.getElementById('pane'+n).classList.toggle('active',n.toLowerCase()===which)})}
async function joinParticipant(){const code=cleanCode(document.getElementById('participantRoom').value);if(!code){alert('Enter Room Code');return}room=code;role='participant';hostPin='';location.hash=room;hostUI();if(await loadRoom())showGate(false)}
async function joinHost(){const code=cleanCode(document.getElementById('hostRoom').value),pin=document.getElementById('hostJoinPin').value.trim();if(!code){alert('Enter Room Code');return}if(!/^\d{4,6}$/.test(pin)){alert('Host PIN must be 4–6 digits');return}const {data,error}=await sb.rpc('verify_host_pin',{p_board_id:code,p_host_pin:pin});if(error||!data){alert('Invalid Room Code or Host PIN');return}room=code;role='host';hostPin=pin;location.hash=room;hostUI();if(await loadRoom())showGate(false)}
async function createRoom(){let code=cleanCode(document.getElementById('createCode').value);if(!code){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';code=Array.from({length:6},()=>chars[Math.floor(Math.random()*chars.length)]).join('');document.getElementById('createCode').value=code}const pin=document.getElementById('createPin').value.trim();if(!/^\d{4,6}$/.test(pin)){alert('Choose a 4–6 digit Host PIN');return}const {error}=await sb.rpc('create_board_with_pin',{p_board_id:code,p_host_pin:pin});if(error){alert(error.message);return}room=code;role='host';hostPin=pin;location.hash=room;hostUI();if(await loadRoom()){showGate(false);alert('Room created: '+code+'\n\nShare only the Room Code with participants. Keep the Host PIN private.')}}
async function leaveRoom(){if(notesCh)await sb.removeChannel(notesCh);if(boardCh)await sb.removeChannel(boardCh);notesCh=boardCh=null;room='';role='participant';hostPin='';boardState=null;location.hash='';for(let e of els.values())e.remove();els.clear();tpl.innerHTML='';hostUI();stat('Not joined');showGate(true)}
document.getElementById('tabParticipant').onclick=()=>selectGate('participant');document.getElementById('tabHost').onclick=()=>selectGate('host');document.getElementById('tabCreate').onclick=()=>selectGate('create');document.getElementById('participantJoin').onclick=joinParticipant;document.getElementById('hostJoin').onclick=joinHost;document.getElementById('createRoom').onclick=createRoom;document.getElementById('leave').onclick=leaveRoom;hostUI();
document.getElementById('add').onclick=async()=>{if(!boardState)return;let [w,h]=document.getElementById('size').value.split(',').map(Number),work=document.getElementById('work');let {data,error}=await sb.from('notes').insert({board_id:room,content:'',x:work.scrollLeft+150+Math.random()*300,y:work.scrollTop+100+Math.random()*200,width:w,height:h,color:document.getElementById('color').value,votes:0}).select().single();if(error)alert(error.message);else put(data)};
document.getElementById('apply').onclick=()=>boardUpd({template:document.getElementById('template').value});
document.getElementById('voteBtn').onclick=()=>boardUpd({voting:!boardState.voting});
document.getElementById('resetVotes').onclick=async()=>{if(confirm('Reset all votes?'))await hostRpc('host_reset_votes',{})};
document.getElementById('mins').onchange=()=>boardUpd({timer_minutes:Number(document.getElementById('mins').value),timer_running:false,timer_end:null});
document.getElementById('timerBtn').onclick=()=>{if(boardState.timer_running)boardUpd({timer_running:false,timer_end:null});else{let m=Number(document.getElementById('mins').value);boardUpd({timer_minutes:m,timer_running:true,timer_end:new Date(Date.now()+m*60000).toISOString()})}};
if(room){document.getElementById('participantRoom').value=room;document.getElementById('hostRoom').value=room;stat('Choose Participant or Host to join');showGate(true)}else{stat('Not joined');showGate(true)}
</script></body></html>
